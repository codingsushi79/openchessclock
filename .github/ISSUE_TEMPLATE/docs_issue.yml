name: Assembly or docs problem
description: A step, wiring table, parts list entry or link is wrong, missing or confusing.
title: "[Docs] "
labels: ["documentation", "triage"]
body:
  - type: dropdown
    id: doc
    attributes:
      label: Which document?
      multiple: true
      options:
        - README.md
        - PARTS.md (parts list)
        - WIRING.md
        - ASSEMBLY.md
        - CONTRIBUTING.md
        - Comments in the firmware or CAD file
        - Other
    validations:
      required: true
  - type: input
    id: section
    attributes:
      label: Section or step
      placeholder: ASSEMBLY.md, step 4.3
  - type: textarea
    id: problem
    attributes:
      label: What's wrong or unclear?
      placeholder: Step 4.3 says to screw the switch from behind, but the screw access holes are hidden by the pivot bracket.
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested fix
      description: Optional. What should it say instead? (Pull requests for doc fixes are very welcome.)
